; Alembic configuration.
;
; `sqlalchemy.url` is deliberately absent. Alembic's own template puts a connection URL here, and
; this file is committed: a template followed without thinking is how a production password reaches
; a public repository. `alembic/env.py` reads the URL from WCR_DATABASE_URL through the same
; settings object the application uses, so there is exactly one place a URL comes from and no
; committed file that could disagree with it.

[alembic]
script_location = alembic

; Migrations are ordered by the numeric prefix in the filename, not by creation time. A timestamp
; prefix orders by whoever generated a revision first, which is not the order they must be applied
; in and is not the order a reviewer reads them in.
file_template = %%(rev)s_%%(slug)s

; The repository root, so `alembic` invoked from anywhere in the tree can still import the package
; when it has not been installed into the environment.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
