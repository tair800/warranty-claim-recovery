[project]
name = "warranty-claim-recovery"
version = "0.1.0"
description = "A resumable case workflow that turns a rejected warranty claim into an evidence-backed resubmission, and survives being killed mid-case."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "redis>=5.2",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.7",
    "fastembed>=0.4",
    "rank-bm25>=0.2.2",
    "numpy>=2.0",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "playwright>=1.49",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warranty_claim_recovery"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PL", "RUF", "S", "T20", "SIM", "ARG"]
ignore = ["S101", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, print their findings, and take fixtures they do not name.
"tests/*" = ["S", "PLR2004", "ARG001", "T20"]
# Scripts are command-line entry points: printing is their interface.
"scripts/*" = ["T20", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*", "rank_bm25.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # Tests that need PostgreSQL or Redis. Registered rather than tolerated: an unregistered mark
    # is a warning today and a typo that silently deselects a whole file tomorrow.
    "infrastructure: needs the local PostgreSQL or Redis from docker-compose.yml",
]
